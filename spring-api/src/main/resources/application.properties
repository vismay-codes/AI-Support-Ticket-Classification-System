spring.application.name=ai-support-ticket-classifier
server.port=8080

# Python ML service
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:5000}

# Default: zero-configuration local H2 database.
# Oracle is available through the oracle profile described in README.md.
spring.datasource.url=jdbc:h2:file:./data/ticketsdb;MODE=Oracle;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
